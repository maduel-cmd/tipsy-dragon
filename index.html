  <body>
    <div id="root"></div>
    <!-- ניקוי מטמון PWA ישן לפני טעינת האפליקציה (קטלוג גלידות → Tipsy) -->
    <script>
      (function () {
        var BUILD = "tipsy-v33-marketable-parity";
        try {
          if (localStorage.getItem("ftb_build") === BUILD) return;
          var done = function () {
            try {
              localStorage.setItem("ftb_build", BUILD);
            } catch (e) {}
          };
          var tasks = [];
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k);
                }));
              }),
            );
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              }),
            );
          }
          Promise.all(tasks).then(done).catch(done);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
